AWSTemplateFormatVersion: "2010-09-09"
Transform: "AWS::Serverless-2016-10-31"
Description: ...

Parameters:
  ProjectName:
    Type: String
  ServiceName:
    Type: String
  Env:
    Type: String
  CodeBucket:
    Type: String
  CodeFile:
    Type: String

Resources:
  IamRoleLambda:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service:
                - lambda.amazonaws.com
      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName
        - Key: ServiceName
          Value: !Ref ServiceName
        - Key: Environment
          Value: !Ref Env

  IamPolicyCloudWatchLogs:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: IamPolicyCloudWatchLogs
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ServiceName}-${Env}:*
      Roles:
        - !Ref IamRoleLambda

  IamPolicySqsAccess:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: IamPolicySqsAccess
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !GetAtt SqsQueueDeadLetter.Arn
      Roles:
        - !Ref IamRoleLambda

  IamPolicyDynamoDbReadWriteAccess:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: IamPolicyDynamoDbReadWriteAccess
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:Query
            Resource:
              - !Sub ${DynamoDBTableUserMetadata.Arn}
              - !Sub ${DynamoDBTableUserMetadata.Arn}/*
          - Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:UpdateItem
            Resource:
              - !Sub ${DynamoDBTableUserMetadata.Arn}
              - !Sub ${DynamoDBTableUserMetadata.Arn}/*
      Roles:
        - !Ref IamRoleLambda

  SqsQueueDeadLetter:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ServiceName}-${Env}-dead-letter

  # SnsTopicUserChange:
  #   Type: AWS::SNS::Topic
  #   Properties:
  #     TopicName: !Sub ${ProjectName}-user-change-${Env}
  #     Tags:
  #       - Key: ProjectName
  #         Value: !Ref ProjectName
  #       - Key: ServiceName
  #         Value: !Ref ServiceName
  #       - Key: Environment
  #         Value: !Ref Env

  DynamoDbTableUserProfiles:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${Env}-${ProjectName}-user-profiles
      AttributeDefinitions:
        - AttributeName: email_address
          AttributeType: S
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: email_address
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: !Sub username
          KeySchema:
            - AttributeName: username
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  DynamoDBTableUserMetadata:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${Env}-${ProjectName}-user-metadata"
      AttributeDefinitions:
        - AttributeName: "user_id"
          AttributeType: "S"
        - AttributeName: "entity_type"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "user_id"
          KeyType: "HASH"
        - AttributeName: "entity_type"
          KeyType: "RANGE"
      BillingMode: PAY_PER_REQUEST

  Lambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${ServiceName}-${Env}
      Handler: lambda_function.lambda_handler
      Architectures:
        - x86_64
      Runtime: python3.12
      CodeUri:
        Bucket: !Ref CodeBucket
        Key: !Ref CodeFile
      Role: !GetAtt IamRoleLambda.Arn
      MemorySize: 128
      Timeout: 15
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:017000801446:layer:AWSLambdaPowertoolsPythonV3-python312-x86_64:2
        - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:layer:python-v3-12-jwt:1
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt SqsQueueDeadLetter.Arn
      Environment:
        Variables:
          AWS_ACCOUNT_ID: !Sub "${AWS::AccountId}"
          ENV: !Ref Env
          DEAD_LETTER_QUEUE_URL: !GetAtt SqsQueueDeadLetter.QueueUrl
      Tags:
        ProjectName: !Ref ProjectName
        ServiceName: !Ref ServiceName
        Environment: !Ref Env

  # SnsSubscriptionLambda:
  #   Type: AWS::SNS::Subscription
  #   Properties:
  #     TopicArn: !Ref SnsTopicUserChange
  #     Protocol: lambda
  #     Endpoint: !GetAtt Lambda.Arn

  IoTCoreRuleRegisterDevice:
    Type: AWS::IoT::TopicRule
    Properties:
      TopicRulePayload:
        Description: "Invoked when a device registers itself via the provisioning process"
        Sql: |
          SELECT
            topic(2) as device_id,
            principal_id
          FROM "bertybear/+/registration/accepted"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt Lambda.Arn
        RuleDisabled: false

  # LambdaPermissionInvokeBySns:
  #   Type: AWS::Lambda::Permission
  #   Properties:
  #     Action: lambda:InvokeFunction
  #     FunctionName: !Ref Lambda
  #     Principal: sns.amazonaws.com
  #     SourceArn: !Ref SnsTopicUserChange

  LambdaPermissionInvokeByIoT:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Lambda
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com
      SourceArn: !GetAtt IoTCoreRuleRegisterDevice.Arn

Outputs:
  LambdaArnOutput:
    Value: !GetAtt Lambda.Arn
    Export:
      Name: !Sub "${ServiceName}-arn-${Env}"
